    # Step 4: Check if SQL Server is reachable
    - name: Check if SQL Server is reachable
      win_ping:
      register: sql_server_ping
      retries: 3
      delay: 5
      until: sql_server_ping.ping == 'pong'
      ignore_errors: true

    - name: Display SQL Server reachability result
      debug:
        msg: "SQL Server ping result: {{ sql_server_ping.ping }}"

    - name: Wait for 5 minutes if SQL Server is not reachable
      pause:
        minutes: 5
      when: sql_server_ping.ping != 'pong'

